%YAML 1.2
---
$id: http://devicetree.org/schemas/perf/st,stm32-ddr-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

maintainers:
  - Clément Le Goffic <legoffic.clement@gmail.com>

title: STMicroelectronics STM32 DDR Performance Monitor (DDRPERFM)

properties:
  compatible:
    oneOf:
      - items:
          - const: st,stm32mp131-ddr-pmu
      - items:
          - enum:
              - st,stm32mp151-ddr-pmu
          - const: st,stm32mp131-ddr-pmu
      - items:
          - const: st,stm32mp251-ddr-pmu

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  access-controllers:
    minItems: 1
    maxItems: 2

  memory-channel:
    description:
      The memory channel this DDRPERFM is attached to.
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: st,stm32mp131-ddr-pmu
    then:
      required:
        - clocks
        - resets

  - if:
      properties:
        compatible:
          contains:
            const: st,stm32mp251-ddr-pmu
    then:
      required:
        - access-controllers
        - memory-channel

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/stm32mp1-clks.h>
    #include <dt-bindings/reset/stm32mp1-resets.h>

    perf@5a007000 {
        compatible = "st,stm32mp151-ddr-pmu", "st,stm32mp131-ddr-pmu";
        reg = <0x5a007000 0x400>;
        clocks = <&rcc DDRPERFM>;
        resets = <&rcc DDRPERFM_R>;
    };

  - |
    ddr_channel: sdram-channel-0 {
        #address-cells = <1>;
        #size-cells = <0>;
        compatible = "jedec,ddr4-channel";
        io-width = <16>;
    };

    perf@48041000 {
      compatible = "st,stm32mp251-ddr-pmu";
      reg = <0x48041000 0x400>;
      access-controllers = <&rcc 104>;
      memory-channel = <&ddr_channel>;
    };
