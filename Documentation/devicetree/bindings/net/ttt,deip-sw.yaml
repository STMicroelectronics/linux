%YAML 1.2
---
$id: http://devicetree.org/schemas/net/ttt,deip-sw.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TTTech DEIP switch node

maintainers:
  - Christophe Roullier <christophe.roullier@foss.st.com>

description: |
  This file documents schema for TTTech DEIP switch node referenced by STM32MP25
  device trees.

select:
  properties:
    compatible:
      contains:
        const: ttt,deip-sw
  required:
    - compatible

properties:
  compatible:
    const: ttt,deip-sw

additionalProperties: true

examples:
  - |
    / {
    #address-cells = <1>;
    #size-cells = <1>;

      intc: interrupt-controller {
         interrupt-controller;
         #interrupt-cells = <3>;
      };

      ttt_sw@4c000000 {
         #address-cells = <1>;
         #size-cells = <1>;
         compatible = "st,stm32-deip";
         ranges = <0x4c000000 0x4c000000 0x2000000>;

         deip_sw0: deip-sw@4c000000 {
           compatible = "ttt,deip-sw";
           reg = <0x4c000000 0x2000000>;
           interrupt-parent = <&intc>;
           interrupts = <0 250 4>;
         };
      };
    };

...
